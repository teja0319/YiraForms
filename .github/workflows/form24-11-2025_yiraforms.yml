name: Build and deploy Node.js app to Azure Web App - yiraforms

on:
  push:
    branches:
      - Form24-11-2025
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install deps & build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare artifact
        run: |
          mkdir deploy
          cp -r .next deploy/.next
          cp -r public deploy/public
          cp package.json deploy/package.json
          cp next.config.mjs deploy/next.config.mjs
          npm ci --omit=dev --legacy-peer-deps
          cp -r node_modules deploy/node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'yiraforms'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C9662B2176C14CF09D8B013A8E171F85 }}
          package: .

